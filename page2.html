<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Surprise ❤️</title>
    <style>
        body {
            background-color: #ffccd5; /* Cute Pink Theme */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: #fff0f3;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
            text-align: center;
            width: 320px;
            border: 2px solid #ffb3c1;
        }
        /* Media Container for Video/GIF */
        .media-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff758c;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .media-container video, .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h2 {
            color: #d81159;
            margin: 10px 0 15px 0;
            font-size: 20px;
            line-height: 1.4;
        }
        .btn-group {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            gap: 15px;
        }
        .btn {
            background: #ff758c;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.4);
            flex: 1;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-no {
            background: #ffb3c1;
            color: #d81159;
        }
        .hidden-msg {
            display: none;
            margin-top: 15px;
            color: #d81159;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <!-- SAGAR ki jagah yahan apni pehli wali cute video/GIF ka naam likh dena -->
        <div class="media-container" id="mediaBox">
            <video src="Dudu2.mp4" autoplay loop muted playsinline id="pageVideo"></video>
        </div>

        <h2>I made something special for you ❤️😅<br><br>Do you wanna to see it..??</h2>
 
        <div class="btn-group">
            <button class="btn" onclick="sayYes()">Yes...</button>
            <button class="btn btn-no" onclick="sayNo()">No....</button>
        </div>

        <!-- No click karne par yeh message aur gusse wali video/GIF dikhegi -->
        <div class="hidden-msg" id="noMessage">
            <div class="media-container" style="margin-bottom: 10px;">
                <video src="dudu3.mp4" autoplay loop muted playsinline></video>
            </div>
            why did you click no?? 😡
        </div>
    </div>

    <script>
        function sayYes() {
            // Yahan hum 3rd page ka link laga denਗੇ جب 3rd page ban jayega
            alert("Yay! Let's go to the next surprise ❤️");
            // window.location.href = "page3.html";
        }

        function sayNo() {
            // No dabane par gusse wala message aur video show hogi
            document.getElementById("noMessage").style.display = "block";
        }
    </script>
</body>
</html>
