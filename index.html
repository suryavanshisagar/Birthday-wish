<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enter Code 💗</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(145deg, #ffe4ef, #ffc6dc, #fff0f6);
    font-family: "Trebuchet MS", sans-serif;
    color: #a83268;
}

.container {
    width: 100%;
    max-width: 360px;
    text-align: center;
    padding: 28px 22px;
    background: rgba(255, 255, 255, 0.65);
    border: 2px solid white;
    border-radius: 28px;
    box-shadow: 0 12px 35px rgba(200, 75, 130, 0.15);
}

/* GIF SECTION */
.gif-box {
    width: 180px;
    height: 180px;
    margin: 0 auto 12px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.gif-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

h1 {
    font-size: 27px;
    margin: 8px 0 18px;
    color: #d94f8b;
    letter-spacing: 0.5px;
}

.code-display {
    min-height: 45px;
    margin: 0 auto 22px;
    padding: 8px;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 8px;
    color: #a83268;
    border-bottom: 2px solid #ee9cbd;
    width: 90%;
    overflow-wrap: anywhere;
}

.keyboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.key {
    height: 55px;
    border: none;
    border-radius: 17px;
    background: #fff;
    color: #c13d79;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #f2b0cc;
    transition: transform 0.12s, background 0.12s;
    -webkit-tap-highlight-color: transparent;
}

.key:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #f2b0cc;
    background: #ffe3ef;
}

.delete {
    background: #ffd2e4;
    font-size: 24px;
}

.zero {
    grid-column: 2;
}

.message {
    min-height: 24px;
    margin-top: 19px;
    font-size: 14px;
    color: #c13d79;
}

@media (max-width: 360px) {
    .container {
        padding: 22px 16px;
    }

    .gif-box {
        width: 155px;
        height: 155px;
    }

    .key {
        height: 50px;
    }
}
</style>
</head>

<body>

<main class="container">

    <!-- GIF FILE: teddy.gif -->
    <div class="gif-box">
        <img src="./teddy.gif" alt="Cute teddy animation">
    </div>

    <h1>Enter Code</h1>

    <div
        class="code-display"
        id="codeDisplay"
        aria-label="Entered code"
        aria-live="polite">
    </div>

    <div class="keyboard">
        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>

        <button
            class="key delete"
            id="deleteButton"
            aria-label="Delete last digit">⌫</button>

        <button class="key zero" data-number="0">0</button>
    </div>

    <p class="message" id="message" aria-live="polite"></p>

</main>

<script>
const SECRET_CODE = "292608";
const MAX_LENGTH = 6;

let enteredCode = "";

const codeDisplay = document.getElementById("codeDisplay");
const message = document.getElementById("message");

function updateDisplay() {
    codeDisplay.textContent = enteredCode;
}

function addDigit(digit) {
    if (enteredCode.length >= MAX_LENGTH) return;

    enteredCode += digit;
    message.textContent = "";
    updateDisplay();

    if (enteredCode.length === MAX_LENGTH) {
        if (enteredCode === SECRET_CODE) {
            message.textContent = "Correct! 💗 Opening surprise...";

            // Next page baad mein connect karenge.
        } else {
            message.textContent = "Oops! Try again 💕";

            setTimeout(() => {
                enteredCode = "";
                updateDisplay();
                message.textContent = "";
            }, 900);
        }
    }
}

document.querySelectorAll("[data-number]").forEach(button => {
    button.addEventListener("click", () => {
        addDigit(button.dataset.number);
    });
});

document.getElementById("deleteButton").addEventListener("click", () => {
    enteredCode = enteredCode.slice(0, -1);
    message.textContent = "";
    updateDisplay();
});

document.addEventListener("keydown", event => {
    if (/^[0-9]$/.test(event.key)) {
        addDigit(event.key);
    } else if (event.key === "Backspace") {
        enteredCode = enteredCode.slice(0, -1);
        message.textContent = "";
        updateDisplay();
    }
});
</script>

</body>
  </html>
